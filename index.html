<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAR Ordering has moved — Atomic Coffee Roasters</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://par-ordering.acr-ops.com/">
  <meta http-equiv="refresh" content="0; url=https://par-ordering.acr-ops.com/">
  <!-- This GitHub Pages copy of the PAR Ordering tool was retired 2026-09-03. The tool now
       lives at par-ordering.acr-ops.com, behind the *.acr-ops.com Cloudflare Access staff
       SSO wall, and refreshes itself nightly from Shopify via a Worker cron.
       This page is a redirect stub only so existing bookmarks keep working. There is
       deliberately no localStorage 'acr_auth' gate here: it never protected anything (it
       was client-side on a public repo) and it is what caused the redirect loop this
       change resolves. The full retired source is in git history and in the Drive
       snapshot at ACR Web Tools / par-ordering. -->
  <style>
    :root { color-scheme: light dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
           background:#faf9f7; color:#1a1a1a; padding:24px; }
    @media (prefers-color-scheme: dark) { body { background:#141414; color:#ededed; } }
    .card { max-width:34rem; text-align:center; }
    h1 { font-size:1.35rem; margin:0 0 .5rem; letter-spacing:-.01em; }
    p { margin:0 0 1.25rem; opacity:.75; }
    a.btn { display:inline-block; padding:.7rem 1.25rem; border-radius:8px;
            background:#1a1a1a; color:#fff; text-decoration:none; font-weight:600; }
    @media (prefers-color-scheme: dark) { a.btn { background:#ededed; color:#141414; } }
    code { font-size:.9em; opacity:.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PAR Ordering has moved</h1>
    <p>It now lives at <code>par-ordering.acr-ops.com</code> and signs you in with your Atomic Google account. Redirecting you there now.</p>
    <a class="btn" href="https://par-ordering.acr-ops.com/">Go to PAR Ordering</a>
  </div>
  <script>location.replace('https://par-ordering.acr-ops.com/');</script>
</body>
</html>
